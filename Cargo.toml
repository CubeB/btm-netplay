[package]
name = "btm-netplay"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Easy multiplayer for Byte Tactics: lockstep, invite codes with NAT punch, desync detection, drop and rejoin."
repository = "https://github.com/CubeB/btm-netplay"

[[bin]]
name = "btm-relay"
path = "src/bin/btm-relay.rs"

[[bin]]
name = "btm-netplay-demo"
path = "src/bin/btm-netplay-demo.rs"

[features]
# Resolve mod directories with btm-mod for the demo's `--mods`. The library itself never
# uses it and stays std-only.
mods = ["dep:btm-mod"]

[dependencies]
btm-mod = { git = "https://github.com/CubeB/btm-mod", rev = "b8d4414", optional = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
